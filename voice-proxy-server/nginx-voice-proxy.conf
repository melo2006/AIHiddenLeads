# nginx-voice-proxy.conf — public edge server block for the website voice proxy.
# Design: proxy-vps-move-design-2026-11-10.md §2.2.
#
# Placement: the box's ports 80/443 are owned by a docker traefik stack and the
# phone bridge was integrated via an `aspen-edge` nginx container. Add this
# server block to that same edge layer (alongside the voice.aihiddenleads.com
# block) at Phase C, adapted to whatever TLS mechanism the live stack uses.
#
# TLS PLACEHOLDER: the ssl_certificate lines below are placeholders. The live
# edge recon (Phase C step 1) decides how voice.aihiddenleads.com gets its
# cert — wildcard vs per-host ACME — and this block must copy THAT mechanism.
# Do not invent new cert paths on the box.
#
# The 1200s proxy timeouts are load-bearing: they must exceed the proxy's
# 900s server session ceiling or the edge becomes the new ~150s-style fuse.

server {
    listen 443 ssl;
    server_name voice-proxy.aihiddenleads.com;

    # --- TLS: copy the live stack's mechanism for voice.aihiddenleads.com ---
    # ssl_certificate     /path/from/live/edge/config/fullchain.pem;
    # ssl_certificate_key /path/from/live/edge/config/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        # WebSocket upgrade (the proxy's only real traffic)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived sockets: a full session can run to the 900s server ceiling.
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;

        # Voice frames are small and latency-sensitive; do not buffer them.
        proxy_buffering off;
    }
}

# Optional (only if the live edge terminates plain HTTP for this host):
# server {
#     listen 80;
#     server_name voice-proxy.aihiddenleads.com;
#     return 301 https://$host$request_uri;
# }
