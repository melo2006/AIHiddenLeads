[functions]
  [functions.auth-email-hook]
    verify_jwt = false
  # Twilio callbacks carry no Supabase JWT, so the gateway rejected them
  # 401 (UNAUTHORIZED_NO_AUTH_HEADER) before the function ran. The
  # function authenticates callbacks by Twilio signature and browser
  # actions by the single-use handoff capability.
  [functions.browser-voice-handoff]
    verify_jwt = false
  [functions.check-iframe-embed]
    verify_jwt = false
  [functions.create-checkout]
    verify_jwt = false
  [functions.generate-ad-comment]
    verify_jwt = false
  # Browsers cannot attach apikey/Authorization headers to a WebSocket, so the
  # gateway JWT check makes every browser voice call fail its upgrade (502).
  # This function authenticates the socket itself via the single-use,
  # server-issued session token in the query string (see gemini-session).
  [functions.gemini-live-proxy]
    verify_jwt = false
  [functions.geo-grid-scan]
    verify_jwt = false
  [functions.get-stripe-price]
    verify_jwt = false
  [functions.live-transfer-bridge]
    verify_jwt = false
  [functions.payments-webhook]
    verify_jwt = false
  [functions.retell-setup]
    verify_jwt = false
  [functions.retell-web-call]
    verify_jwt = false
  [functions.scan-website]
    verify_jwt = false
  [functions.scrape-social-ads]
    verify_jwt = false
  [functions.search-intent-leads]
    verify_jwt = false
  [functions.search-places]
    verify_jwt = false
  [functions.send-outreach-sms]
    verify_jwt = false
  [functions.telephony-stream]
    verify_jwt = false
  [functions.telephony-voice]
    verify_jwt = false
  [functions.track-engagement]
    verify_jwt = false
  [functions.twilio-sms-status]
    verify_jwt = false
  [functions.whatsapp-webhook]
    verify_jwt = false
  # Browsers call the demo verification gate without supabase-js auth
  # headers; the function authorizes via the lead id and the code itself.
  [functions.demo-verification]
    verify_jwt = false
  # Browsers resolve cold-email invite links without supabase-js auth
  # headers; the function authorizes via the invite slug + code itself.
  [functions.demo-invite]
    verify_jwt = false
  # Phones open the booking confirmation SMS's /cal/<bookingId> link with
  # no supabase-js auth headers; the function authorizes via the
  # unguessable booking UUID itself.
  [functions.get-booking-ics]
    verify_jwt = false
  # Admin-only report API: the signed-in admin's JWT is required at the
  # gateway AND the function re-checks voice_platform_roles itself.
  [functions.outreach-report]
    verify_jwt = true
