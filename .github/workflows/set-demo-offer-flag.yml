# One-shot: set the DEMO_OFFER_ENABLED Edge Function secret (new-flow
# choreography go-live, Ron approved 2026-11-23). Remove after use.
name: Set DEMO_OFFER_ENABLED secret

on:
  workflow_dispatch:

jobs:
  set-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Install Supabase CLI
        run: npm install -g supabase@latest

      - name: Set DEMO_OFFER_ENABLED=true
        run: supabase secrets set DEMO_OFFER_ENABLED=true --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Verify the secret exists (names only)
        run: supabase secrets list --project-ref "$SUPABASE_PROJECT_ID" | grep -E "DEMO_OFFER_ENABLED|AVATAR_SWAP_ENABLED|TEAM_INTRO_ENABLED" || true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
